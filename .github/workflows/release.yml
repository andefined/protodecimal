# Publishes a release when its tags are pushed (see "Versioning" in README.md).
# Pull requests that touch packaging build and test the wheels without
# publishing anything.
#
# One-time setup:
# - PyPI: add a trusted publisher for this repository, workflow release.yml and
#   environment "pypi", for both protodecimal and protodecimal-native.
# - Settings > Environments: create "pypi". Settings > Pages: source "GitHub Actions".
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - py/native/**
      - pyproject.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check the tags
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the version, changelog and Go tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          packages="$(make -s version)"
          if [ "$packages" != "$version" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but the packages are $packages."
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section."
            exit 1
          fi
          if [ "$(git rev-list -n 1 "go/v$version" 2>/dev/null)" != "$(git rev-parse HEAD)" ]; then
            echo "::error::Tag go/v$version is missing or on another commit. Push both tags from make tag."
            exit 1
          fi

  ci:
    name: CI
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  wheels:
    name: Native wheel, ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: py/native
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-native-${{ matrix.os }}-${{ matrix.target }}
          path: py/native/dist

  sdist:
    name: Source and pure-Python packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build --out-dir dist
      - run: uv build --sdist py/native --out-dir dist
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist-python
          path: dist

  smoke:
    name: Installed wheels, ${{ matrix.os }} Python ${{ matrix.python }}
    needs: [wheels, sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
        native: [true]
        include:
          # The pure-Python package on its own.
          - { os: ubuntu-latest, python: "3.14", native: false }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Install from the built files only
        run: |
          python -m pip install "protobuf>=6.30,<7"
          python -m pip install --no-index --find-links dist \
            "protodecimal${{ matrix.native && '[native]' || '' }}"
      # Run the tests from a copy, so they import the installed package rather
      # than the source tree.
      - name: Test
        run: |
          mkdir "$RUNNER_TEMP/smoke"
          cp -r py/tests py/example "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          python -m unittest discover tests
        env:
          PROTODECIMAL_REQUIRE_NATIVE: ${{ matrix.native && '1' || '' }}

  pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [verify, ci, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/protodecimal/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Lets a re-run finish an upload that stopped partway.
          skip-existing: true

  go:
    name: Announce the Go module
    if: github.ref_type == 'tag'
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # Fetching through the proxy makes the version available to go get and
      # pkg.go.dev straight away.
      - run: |
          cd "$(mktemp -d)"
          go list -m "github.com/andefined/protodecimal/go@$GITHUB_REF_NAME"
        env:
          GOPROXY: https://proxy.golang.org

  github:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [pypi, go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Take the notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found
          ' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    name: Docs
    needs: [github]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
