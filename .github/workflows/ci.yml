name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Versions and lock files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: make version
      - run: uv lock --check
      - run: cargo metadata --locked --format-version 1 > /dev/null
        working-directory: py/native
      - run: go mod tidy -diff
        working-directory: go

  proto:
    name: Proto lint and breaking changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Format is off because decimal.proto aligns its fields by hand.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          format: false
          push: false
          pr_comment: false

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      # The version that generated the checked-in code.
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.33.0
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          setup_only: true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make generate
      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is out of date. Run make generate and commit the result."
            exit 1
          fi

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", stable]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: go

  fuzz:
    name: Go fuzz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go/go.sum
      - run: go test -run '^$' -fuzz '^FuzzUnmarshal$' -fuzztime 30s ./decimalconv
      - run: go test -run '^$' -fuzz '^FuzzSnapshotDecimals$' -fuzztime 30s ./example
      - run: go test -run '^$' -fuzz '^FuzzScalarBlockDecimals$' -fuzztime 30s ./example

  python:
    name: Python ${{ matrix.python }}, protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        protobuf: [locked]
        include:
          # The oldest supported protobuf, at both ends of the native range.
          - python: "3.10"
            protobuf: "6.30.0"
          - python: "3.14"
            protobuf: "6.30.0"
    env:
      # The native encoder needs Python 3.10 or newer.
      NATIVE: ${{ matrix.python != '3.9' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - if: env.NATIVE == 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - if: env.NATIVE == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: py/native
      - run: uv sync --locked ${{ env.NATIVE == 'true' && '--extra native' || '' }}
      - if: matrix.protobuf != 'locked'
        run: uv pip install "protobuf==${{ matrix.protobuf }}"
      - run: make test-python
        env:
          UV_NO_SYNC: 1
      - if: env.NATIVE == 'true'
        run: make test-native
        env:
          UV_NO_SYNC: 1

  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make lint-python

  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: py/native
      - run: make lint-rust
