version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /py/native
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The shipped generated code is stamped for protobuf 6 and won't import
      # on 7, so moving to 7 needs regenerating, not a version bump.
      - dependency-name: protobuf
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
