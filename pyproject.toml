[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protodecimal"
dynamic = ["version"]
description = "Compact lossless protobuf decimals: decimal.Decimal conversions and the protoc-gen-python-decimal codegen plugin"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# The floor is the gencode stamp of the shipped decimal_pb2.py (see
# buf.gen.yaml): older 6.x runtimes and other major versions refuse to import
# it. Verified by running the test suite on 6.30.0 and the locked 6.x version.
dependencies = [
    "protobuf>=6.30,<7",
]

[project.optional-dependencies]
# The compiled encoder for fast_encode, which falls back to pure Python without
# it. The pin must match the version; make set-version updates it.
native = [
    "protodecimal-native==0.1.0",
]

[project.urls]
Homepage = "https://github.com/andefined/protodecimal"
Documentation = "https://andefined.github.io/protodecimal/"
Changelog = "https://github.com/andefined/protodecimal/blob/main/CHANGELOG.md"

[project.scripts]
protoc-gen-python-decimal = "protodecimal.plugin:main"

[tool.setuptools.dynamic]
version = { attr = "protodecimal.__version__" }

[tool.setuptools.packages.find]
where = ["py"]
include = ["protodecimal*"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.15.21",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
]

[tool.uv.sources]
protodecimal-native = { path = "py/native" }

[tool.ruff]
src = ["py"]
extend-exclude = ["*_pb2.py", "*_pb2_decimal.py"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
