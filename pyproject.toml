[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protodecimal"
version = "0.1.0"
description = "Compact lossless protobuf decimals: decimal.Decimal conversions and the protoc-gen-python-decimal codegen plugin"
requires-python = ">=3.9"
# The floor is the gencode stamp of the shipped decimal_pb2.py (see
# buf.gen.yaml): older 6.x runtimes and other major versions refuse to import
# it. Verified by running the test suite on 6.30.0 and the locked 6.x version.
dependencies = [
    "protobuf>=6.30,<7",
]

[project.scripts]
protoc-gen-python-decimal = "protodecimal.plugin:main"

[tool.setuptools.packages.find]
where = ["py"]
include = ["protodecimal*"]

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.15.21",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
]
# The compiled encoder (needs Rust). fast_encode falls back to pure Python
# without it. It targets the stable ABI from 3.10, hence the marker.
native = [
    "protodecimal-native; python_version >= '3.10'",
]

[tool.uv.sources]
protodecimal-native = { path = "py/native" }

[tool.ruff]
src = ["py"]
extend-exclude = ["*_pb2.py", "*_pb2_decimal.py"]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
