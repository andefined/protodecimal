[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "protodecimal-native"
version = "0.1.0"
description = "Optional compiled encoder for protodecimal"
requires-python = ">=3.10"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "protodecimal_native"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]
